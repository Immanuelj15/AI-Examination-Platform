<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | Evalora Enterprise Assessment</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 40px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    h1 { color: #123B7A; margin-top: 0; font-size: 24px; }
    p { color: #64748B; font-size: 15px; line-height: 1.5; }
    .badge {
      display: inline-block;
      background: #EFF6FF;
      color: #2563EB;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    button {
      background: #123B7A;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Connection Interrupted</div>
    <h1>Network Disconnected</h1>
    <p>Your examination answers and session state are safely protected in local storage. Reconnect to resume your examination session.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
