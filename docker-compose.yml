version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: evalora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evalora
      POSTGRES_PASSWORD: evalora_secure_password
      POSTGRES_DB: evalora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalora -d evalora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evalora_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: evalora_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://evalora:evalora_secure_password@postgres:5432/evalora_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=evalora-super-secure-production-jwt-key-32chars-minimum-hash
      - JWT_REFRESH_SECRET=evalora-super-secure-refresh-jwt-key-32chars-minimum-hash
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
      - GROQ_FALLBACK_MODEL=${GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: evalora_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: evalora_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
