name: Evalora Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evalora
          POSTGRES_PASSWORD: evalora_secure_password
          POSTGRES_DB: evalora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migration Checks
        run: |
          cd backend
          alembic check || alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///./evalora_ci_test.db
          JWT_SECRET: ci-testing-secret-jwt-key-minimum-32-chars
          JWT_REFRESH_SECRET: ci-testing-refresh-secret-jwt-key-min-32
        run: |
          cd backend
          pytest -v tests/

  frontend-build:
    name: Frontend Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify Next.js Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Container Build & Security Scan
    needs: [backend-test, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -t evalora-backend:latest ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t evalora-frontend:latest ./frontend
